<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern Inky Mood Rig V1</title>
<style>
:root{--wine:#6b2938;--gold:#b58e46;--ink:#25272a;--paper:#fffaf0}*{box-sizing:border-box}
body{margin:0;background:#f5efe3;color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}
h1{margin:0;color:var(--wine);font:700 34px/1.1 Georgia,serif}.lead{margin:7px 0 22px;color:#687078}
.layout{display:grid;grid-template-columns:minmax(590px,1fr) 320px;gap:24px}.stage{position:relative;height:680px;overflow:hidden;border:1px solid #d6c6aa;border-radius:28px;background:radial-gradient(circle at 50% 48%,#fffdf7 0,#f8f1e4 58%,#ecdfca 100%);box-shadow:inset 0 0 0 1px #fff9}
.scene{position:absolute;width:600px;height:600px;left:50%;top:50%;translate:-50% -50%}.part,.fx{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none}
.character{position:absolute;inset:0;z-index:4;transform-origin:50% 73%;animation:float 4s ease-in-out infinite}.body{width:300px;left:150px;top:18px;filter:drop-shadow(0 18px 15px #5c3f2026)}
.scarf{z-index:8;width:286px;left:157px;top:336px;transform-origin:50% 35%;animation:scarf 4.2s ease-in-out infinite}
.eye{z-index:9;top:242px;width:43px;transition:transform .12s ease,opacity .2s}.eye-left{left:224px}.eye-right{left:330px;width:47px}
.lid{z-index:11;top:260px;width:48px;opacity:0;transition:opacity .08s}.lid-left{left:221px}.lid-right{left:332px}
.mouth{z-index:10;opacity:0;transition:opacity .12s}.mouth.active{opacity:1}.mouth-smile{width:44px;left:278px;top:313px}.mouth-open{width:46px;left:277px;top:301px}.mouth-o{width:20px;left:290px;top:313px}.mouth-frown{width:46px;left:277px;top:318px}
.inner-glow{z-index:5;width:190px;left:205px;top:188px;opacity:.2;mix-blend-mode:screen;animation:glow 3.4s ease-in-out infinite}
.effects{position:absolute;inset:0;z-index:2}.fx{opacity:0;transition:opacity .25s ease}.halo{width:310px;left:145px;top:135px}.beam{width:190px;left:356px;top:210px;transform-origin:3% 55%}.sparks{width:210px;left:200px;top:120px}.broken{width:290px;left:155px;top:145px}
.stage[data-state="idle"] .halo{opacity:.2;animation:pulse 3.2s ease-in-out infinite}.stage[data-state="hover"] .beam{opacity:.5;animation:search 2.6s ease-in-out infinite}.stage[data-state="opened"] .halo{opacity:.72;animation:pop .7s ease-out}.stage[data-state="opened"] .sparks{opacity:.65;animation:rise 2.8s ease-in infinite}
.stage[data-state="listening"] .halo{opacity:.52;animation:listening 2s ease-out infinite}.stage[data-state="thinking"] .beam{opacity:.65;animation:scan 2s ease-in-out infinite}.stage[data-state="thinking"] .sparks{opacity:.45;animation:orbit 3.3s linear infinite}
.stage[data-state="found"] .beam{opacity:.78;transform:rotate(-8deg)}.stage[data-state="found"] .sparks{opacity:.75;animation:pop .55s ease-out}.stage[data-state="success"] .halo{opacity:1;animation:success .75s ease-out 2}.stage[data-state="success"] .sparks{opacity:1;animation:rise 1.8s ease-in infinite}.stage[data-state="success"] .character{animation:bounce .8s ease-out 2}.stage[data-state="success"] .scarf{animation:scarf-cheer .8s ease-out 2}
.stage[data-state="help"] .broken{opacity:.55;animation:wobble 2.1s ease-in-out infinite}.stage[data-state="help"] .inner-glow{animation:flicker 2.2s steps(1) infinite}.stage[data-state="error"] .broken{opacity:.85;filter:hue-rotate(320deg) saturate(1.2);animation:jitter .65s ease-in-out infinite}.stage[data-state="error"] .inner-glow{animation:sputter .8s steps(1) infinite}.stage[data-state="error"] .eye-left{transform:rotate(9deg) translateX(5px)}.stage[data-state="error"] .eye-right{transform:rotate(-9deg) translateX(-5px)}
.stage[data-state="offline"] .body,.stage[data-state="offline"] .scarf{filter:grayscale(.35) brightness(.64)}.stage[data-state="offline"] .eye{opacity:.08}.stage[data-state="offline"] .lid{opacity:1}.stage[data-state="offline"] .inner-glow{opacity:.08;animation:none}.stage.blink .lid{opacity:1}
.controls{padding:18px;border:1px solid #d2c3aa;border-radius:20px;background:var(--paper);box-shadow:0 12px 30px #49372a12}.controls h2{margin:0 0 12px;color:var(--wine);font:700 22px Georgia,serif}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{padding:10px;border:1px solid #bca77f;border-radius:9px;background:#fff;color:#35272b;font-weight:750;text-align:left;cursor:pointer}button:hover{background:#f7efe5}button.active{border-color:var(--wine);background:var(--wine);color:#fff}.status{margin-top:14px;padding:13px;border-radius:12px;background:#f2eadc;color:#5c6670;font-size:13px;line-height:1.45}
@keyframes float{0%,100%{transform:translateY(3px) rotate(-.25deg)}50%{transform:translateY(-7px) rotate(.4deg)}}@keyframes scarf{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.8deg)}}@keyframes glow{0%,100%{opacity:.16;scale:.96}50%{opacity:.31;scale:1.03}}@keyframes pulse{0%,100%{scale:.88;opacity:.14}50%{scale:1.04;opacity:.35}}@keyframes search{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(11deg)}}@keyframes scan{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}@keyframes pop{0%{scale:.5;opacity:0}70%{scale:1.08}100%{scale:1}}@keyframes rise{0%{translate:0 18px;opacity:.1}50%{opacity:1}100%{translate:0 -24px;opacity:0}}@keyframes orbit{to{rotate:360deg}}@keyframes listening{0%{scale:.75;opacity:.12}65%{opacity:.65}100%{scale:1.13;opacity:0}}@keyframes success{0%{scale:.7;opacity:.2}60%{scale:1.15;opacity:1}100%{scale:1;opacity:.7}}@keyframes bounce{0%,100%{transform:none}45%{transform:translateY(-16px) scale(1.035)}75%{transform:translateY(2px) scale(.99)}}@keyframes scarf-cheer{0%,100%{transform:none}50%{transform:translateY(-8px) scale(1.04)}}@keyframes wobble{0%,100%{rotate:-6deg;scale:.92}50%{rotate:7deg;scale:1.02}}@keyframes flicker{0%,100%{opacity:.18}35%{opacity:.05}42%{opacity:.3}70%{opacity:.11}}@keyframes jitter{0%,100%{translate:-3px 0;rotate:-2deg}50%{translate:4px 1px;rotate:3deg}}@keyframes sputter{0%,100%{opacity:.28}25%{opacity:.03}35%{opacity:.34}55%{opacity:.06}65%{opacity:.2}}
@media(max-width:930px){.layout{grid-template-columns:1fr}.stage{height:650px}}@media(max-width:650px){main{padding:15px}.stage{height:540px}.scene{scale:.78}.buttons{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body><main><h1>Lantern Inky — Mood Rig V1</h1><p class="lead">Transparent layered prototype using light, expression, scarf movement, and comic glow behavior.</p><div class="layout">
<section class="stage" id="stage" data-state="idle"><div class="scene" id="scene"><div class="effects"><img class="fx halo" src="assets/halo.png" alt=""><img class="fx beam" src="assets/beam.png" alt=""><img class="fx sparks" src="assets/sparks.png" alt=""><img class="fx broken" src="assets/broken_halo.png" alt=""></div><div class="character"><img class="part body" src="assets/body_blank.png" alt="Lantern Inky"><img class="part inner-glow" src="assets/inner_glow.png" alt=""><img class="part scarf" src="assets/scarf.png" alt=""><img class="part eye eye-left" src="assets/eye_left.png" alt=""><img class="part eye eye-right" src="assets/eye_right.png" alt=""><img class="part lid lid-left" src="assets/lid_left.png" alt=""><img class="part lid lid-right" src="assets/lid_right.png" alt=""><img class="part mouth mouth-smile active" data-mouth="smile" src="assets/mouth_smile.png" alt=""><img class="part mouth mouth-open" data-mouth="open" src="assets/mouth_open.png" alt=""><img class="part mouth mouth-o" data-mouth="o" src="assets/mouth_o.png" alt=""><img class="part mouth mouth-frown" data-mouth="frown" src="assets/mouth_frown.png" alt=""></div></div></section>
<aside class="controls"><h2>Mood States</h2><div class="buttons"><button class="active" data-state="idle">Idle</button><button data-state="hover">Hover</button><button data-state="opened">Opened</button><button data-state="listening">Listening</button><button data-state="thinking">Thinking</button><button data-state="found">Found Something</button><button data-state="success">Success</button><button data-state="help">Needs Help</button><button data-state="error">Error</button><button data-state="offline">Offline</button></div><div class="status" id="status">Idle — a warm steady glow and slow halo breathe quietly.</div></aside>
</div></main><script>
const moods={idle:['smile','Idle — a warm steady glow and slow halo breathe quietly.'],hover:['smile','Hover — a curious spotlight searches toward the pointer.'],opened:['open','Opened — a welcoming pulse and sparks brighten the greeting.'],listening:['smile','Listening — expanding light rings settle into a quiet rhythm.'],thinking:['o','Thinking — a rotating search beam and orbiting sparks inspect the story.'],found:['open','Found Something — one focused beam locks onto the useful detail.'],success:['open','Success — Lantern bounces into a deliberately over-bright celebration.'],help:['frown','Needs Help — the glow hesitates and a broken halo wobbles uncertainly.'],error:['o','Error — harmless sparks sputter while the eyes briefly cross.'],offline:['smile','Offline — the face sleeps while the lower chamber rests at ember brightness.']};
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),status=document.getElementById('status'),mouths=[...document.querySelectorAll('[data-mouth]')],eyes=[...document.querySelectorAll('.eye')];
function setState(state,button){stage.dataset.state=state;status.textContent=moods[state][1];mouths.forEach(m=>m.classList.toggle('active',m.dataset.mouth===moods[state][0]));document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b===button))}
document.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>setState(button.dataset.state,button)));
stage.addEventListener('pointermove',event=>{if(stage.dataset.state==='offline'||stage.dataset.state==='error')return;const r=scene.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(event.clientX-r.left-r.width/2)/(r.width/2))),y=Math.max(-1,Math.min(1,(event.clientY-r.top-r.height/2)/(r.height/2)));eyes.forEach(eye=>eye.style.transform='translate('+(x*5)+'px,'+(y*4)+'px)')});stage.addEventListener('pointerleave',()=>eyes.forEach(eye=>eye.style.transform=''));
function blink(){if(stage.dataset.state!=='offline'){stage.classList.add('blink');setTimeout(()=>stage.classList.remove('blink'),130)}setTimeout(blink,2700+Math.random()*2600)}setTimeout(blink,1800);
</script></body></html>
