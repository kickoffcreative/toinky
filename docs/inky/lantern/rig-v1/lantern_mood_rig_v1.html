<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern Inky Mood Rig V1</title>
<style>
:root{--wine:#6b2938;--gold:#b58e46;--ink:#25272a;--paper:#fffaf0;--scarf-deep:#07564f;--scarf-mid:#0d7464;--scarf-light:#93ad39;--scarf-gold:#dacd37}*{box-sizing:border-box}
body{margin:0;background:#f5efe3;color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}
h1{margin:0;color:var(--wine);font:700 34px/1.1 Georgia,serif}.lead{margin:7px 0 22px;color:#687078}
.layout{display:grid;grid-template-columns:minmax(590px,1fr) 320px;gap:24px}.stage{position:relative;height:680px;overflow:hidden;border:1px solid #d6c6aa;border-radius:28px;background:radial-gradient(circle at 50% 48%,#fffdf7 0,#f8f1e4 58%,#ecdfca 100%);box-shadow:inset 0 0 0 1px #fff9}
.scene{position:absolute;width:600px;height:600px;left:50%;top:50%;translate:-50% -50%}.part,.fx{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none}
.effects-back{position:absolute;inset:0;z-index:2}.effects-front{position:absolute;inset:0;z-index:14;pointer-events:none}.fx{opacity:0;transition:opacity .25s ease}
.character{position:absolute;inset:0;z-index:4;transform-origin:50% 73%;animation:float 4s ease-in-out infinite}.body{width:300px;left:150px;top:18px;filter:drop-shadow(0 18px 15px #5c3f2026)}
.inner-glow{z-index:5;width:180px;left:210px;top:216px;opacity:.2;mix-blend-mode:screen;animation:glow 3.4s ease-in-out infinite}
.scarf-system{position:absolute;inset:0;z-index:8;pointer-events:none}.neck-band{position:absolute;left:168px;top:310px;width:264px;height:62px;border:6px solid #071d1a;border-radius:46% 46% 40% 40%/52% 52% 48% 48%;background:linear-gradient(168deg,var(--scarf-deep) 0 17%,var(--scarf-mid) 17% 31%,var(--scarf-light) 31% 39%,var(--scarf-gold) 39% 47%,var(--scarf-mid) 47% 68%,#084b49 68% 100%);box-shadow:inset 0 5px 0 #ffffff21,inset 0 -7px 0 #001e1b3d,0 3px 2px #0002;transform:rotate(-.8deg)}
.neck-band:before,.neck-band:after{content:"";position:absolute;inset:7px 14px;border-radius:inherit;pointer-events:none}.neck-band:before{background:radial-gradient(circle at 18% 38%,#b6cb4d55 0 7%,transparent 8%),radial-gradient(circle at 43% 62%,#e1d43d55 0 6%,transparent 7%),radial-gradient(circle at 72% 28%,#60a36b66 0 8%,transparent 9%),radial-gradient(circle at 88% 68%,#d2ca3860 0 5%,transparent 6%);mix-blend-mode:screen}.neck-band:after{border-top:2px solid #ffffff22;border-bottom:2px solid #001f1c3d}
.ribbon{position:absolute;top:342px;width:126px;height:54px;border:5px solid #071d1a;background:linear-gradient(165deg,#0b6c60 0 25%,#9aaf3a 25% 38%,#d8ce39 38% 47%,#0c665d 47% 70%,#084846 70% 100%);box-shadow:inset 0 4px 0 #ffffff18,inset 0 -6px 0 #001d1a35;transition:transform .45s cubic-bezier(.2,.8,.25,1),top .45s cubic-bezier(.2,.8,.25,1)}
.ribbon:after{content:"";position:absolute;inset:6px 11px;background:radial-gradient(circle at 22% 36%,#c7d75e55 0 7%,transparent 8%),radial-gradient(circle at 58% 65%,#e3d83f52 0 7%,transparent 8%),radial-gradient(circle at 78% 30%,#63a37066 0 8%,transparent 9%);mix-blend-mode:screen}
.ribbon-left{left:188px;border-radius:75% 20% 70% 35%/55% 40% 60% 50%;transform-origin:100% 36%;transform:rotate(18deg)}.ribbon-right{left:286px;border-radius:20% 75% 35% 70%/40% 55% 50% 60%;transform-origin:0 36%;transform:rotate(-18deg)}
.clasp{position:absolute;left:270px;top:326px;width:62px;height:62px;border:5px solid #2b1b05;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff5a9 0 5%,#ffd447 11%,#e8a410 34%,#b56d08 58%,#f3be1b 71%,#8a4f04 100%);box-shadow:inset 0 0 0 5px #ffe56c77,inset 0 0 0 10px #8f53046b,0 3px 2px #0003}.clasp:before,.clasp:after{content:"";position:absolute;border-radius:50%;inset:11px;border:3px solid #5c3305}.clasp:after{inset:22px;background:#dc9b0f;border:2px solid #522d04;box-shadow:inset 0 0 0 2px #ffc92f}
.eye{z-index:9;top:242px;width:43px;transition:transform .12s ease;animation:eye-blink 4s steps(1,end) infinite}.eye-left{left:254px}.eye-right{left:300px;width:47px}
.lid{z-index:11;width:48px;opacity:0;animation:lid-blink 4s steps(1,end) infinite}.lid-left{left:252px;top:241px}.lid-right{left:300px;top:260px}
.mouth{z-index:10;opacity:0;transition:opacity .12s}.mouth.active{opacity:1}.mouth-smile{width:44px;left:278px;top:313px}.mouth-open{width:46px;left:277px;top:301px}.mouth-o{width:20px;left:290px;top:313px}.mouth-frown{width:46px;left:277px;top:318px}
.halo{width:360px;left:120px;top:112px}.beam{width:230px;left:270px;top:275px;transform-origin:50% 0;mix-blend-mode:screen;filter:drop-shadow(0 0 8px #ffd96966)}.sparks{width:240px;left:180px;top:105px}.broken{width:330px;left:135px;top:120px;clip-path:inset(48px 0 0)}
.stage[data-state="idle"] .halo{opacity:.2;animation:pulse 3.2s ease-in-out infinite}.stage[data-state="idle"] .ribbon-left{transform:rotate(28deg) translateY(4px)}.stage[data-state="idle"] .ribbon-right{transform:rotate(-28deg) translateY(4px)}
.stage[data-state="hover"] .beam{opacity:.42;animation:search 2.6s ease-in-out infinite}.stage[data-state="hover"] .ribbon-left{transform:rotate(11deg) translateY(-3px)}.stage[data-state="hover"] .ribbon-right{transform:rotate(-31deg) translateY(3px)}
.stage[data-state="opened"] .halo{width:470px;left:65px;top:55px;opacity:.78;animation:pop .7s ease-out}.stage[data-state="opened"] .sparks{width:285px;left:158px;top:85px;opacity:.72;animation:rise 2.8s ease-in infinite}.stage[data-state="opened"] .ribbon-left{transform:rotate(-3deg) translateY(-8px)}.stage[data-state="opened"] .ribbon-right{transform:rotate(3deg) translateY(-8px)}
.stage[data-state="listening"] .halo{opacity:.52;animation:listening 2s ease-out infinite}.stage[data-state="listening"] .ribbon-left{transform:rotate(34deg) translateY(7px)}.stage[data-state="listening"] .ribbon-right{transform:rotate(-34deg) translateY(7px)}
.stage[data-state="thinking"] .beam{width:255px;left:255px;top:270px;opacity:.5;animation:scan 2s ease-in-out infinite}.stage[data-state="thinking"] .sparks{width:390px;left:105px;top:20px;opacity:.68;animation:orbit 3.3s linear infinite}.stage[data-state="thinking"] .ribbon-left{animation:ribbon-think-left 2.2s ease-in-out infinite}.stage[data-state="thinking"] .ribbon-right{animation:ribbon-think-right 2.2s ease-in-out infinite}
.stage[data-state="found"] .beam{opacity:.55;transform:rotate(-84deg)}.stage[data-state="found"] .sparks{opacity:.75;animation:pop .55s ease-out}.stage[data-state="found"] .ribbon-left{transform:rotate(-12deg) translateY(-10px)}.stage[data-state="found"] .ribbon-right{transform:rotate(-25deg) translateY(1px)}
.stage[data-state="success"] .halo{opacity:1;animation:success .75s ease-out 2}.stage[data-state="success"] .sparks{opacity:1;animation:rise 1.8s ease-in infinite}.stage[data-state="success"] .character{animation:bounce .8s ease-out 2}.stage[data-state="success"] .ribbon-left{animation:ribbon-cheer-left .8s ease-out 2}.stage[data-state="success"] .ribbon-right{animation:ribbon-cheer-right .8s ease-out 2}
.stage[data-state="help"] .broken{opacity:.55;animation:wobble 2.1s ease-in-out infinite}.stage[data-state="help"] .inner-glow{animation:flicker 2.2s steps(1) infinite}.stage[data-state="help"] .ribbon-left{transform:rotate(47deg) translateY(14px)}.stage[data-state="help"] .ribbon-right{transform:rotate(-47deg) translateY(14px)}
.stage[data-state="error"] .broken{opacity:.85;filter:hue-rotate(320deg) saturate(1.2);animation:jitter .65s ease-in-out infinite}.stage[data-state="error"] .inner-glow{width:210px;left:195px;top:205px;animation:sputter .8s steps(1) infinite}.stage[data-state="error"] .eye-left{transform:rotate(9deg) translateX(5px)}.stage[data-state="error"] .eye-right{transform:rotate(-9deg) translateX(-5px)}.stage[data-state="error"] .ribbon-left{animation:ribbon-error-left .55s ease-in-out infinite}.stage[data-state="error"] .ribbon-right{animation:ribbon-error-right .55s ease-in-out infinite}
.stage[data-state="offline"] .body,.stage[data-state="offline"] .neck-band,.stage[data-state="offline"] .ribbon,.stage[data-state="offline"] .clasp{filter:grayscale(.35) brightness(.64)}.stage[data-state="offline"] .eye{opacity:.08;animation:none}.stage[data-state="offline"] .lid{opacity:1;animation:none}.stage[data-state="offline"] .inner-glow{opacity:.08;animation:none}.stage[data-state="offline"] .ribbon-left{transform:rotate(52deg) translateY(18px)}.stage[data-state="offline"] .ribbon-right{transform:rotate(-52deg) translateY(18px)}
.controls{padding:18px;border:1px solid #d2c3aa;border-radius:20px;background:var(--paper);box-shadow:0 12px 30px #49372a12}.controls h2{margin:0 0 12px;color:var(--wine);font:700 22px Georgia,serif}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{padding:10px;border:1px solid #bca77f;border-radius:9px;background:#fff;color:#35272b;font-weight:750;text-align:left;cursor:pointer}button:hover{background:#f7efe5}button.active{border-color:var(--wine);background:var(--wine);color:#fff}.status{margin-top:14px;padding:13px;border-radius:12px;background:#f2eadc;color:#5c6670;font-size:13px;line-height:1.45}
@keyframes eye-blink{0%,42%,58%,100%{opacity:1}43%,57%{opacity:0}}@keyframes lid-blink{0%,42%,58%,100%{opacity:0}43%,57%{opacity:1}}@keyframes float{0%,100%{transform:translateY(3px) rotate(-.25deg)}50%{transform:translateY(-7px) rotate(.4deg)}}@keyframes glow{0%,100%{opacity:.16;scale:.96}50%{opacity:.31;scale:1.03}}@keyframes pulse{0%,100%{scale:.88;opacity:.14}50%{scale:1.04;opacity:.35}}@keyframes search{0%,100%{transform:rotate(-100deg)}50%{transform:rotate(-72deg)}}@keyframes scan{0%,100%{transform:rotate(-112deg)}50%{transform:rotate(-58deg)}}@keyframes pop{0%{scale:.5;opacity:0}70%{scale:1.08}100%{scale:1}}@keyframes rise{0%{translate:0 18px;opacity:.1}50%{opacity:1}100%{translate:0 -24px;opacity:0}}@keyframes orbit{to{rotate:360deg}}@keyframes listening{0%{scale:.75;opacity:.12}65%{opacity:.65}100%{scale:1.13;opacity:0}}@keyframes success{0%{scale:.7;opacity:.2}60%{scale:1.15;opacity:1}100%{scale:1;opacity:.7}}@keyframes bounce{0%,100%{transform:none}45%{transform:translateY(-16px) scale(1.035)}75%{transform:translateY(2px) scale(.99)}}@keyframes wobble{0%,100%{rotate:-6deg;scale:.92}50%{rotate:7deg;scale:1.02}}@keyframes flicker{0%,100%{opacity:.18}35%{opacity:.05}42%{opacity:.3}70%{opacity:.11}}@keyframes jitter{0%,100%{translate:-3px 0;rotate:-2deg}50%{translate:4px 1px;rotate:3deg}}@keyframes sputter{0%,100%{opacity:.28}25%{opacity:.03}35%{opacity:.34}55%{opacity:.06}65%{opacity:.2}}@keyframes ribbon-think-left{0%,100%{transform:rotate(19deg) translateY(1px)}50%{transform:rotate(7deg) translateY(-5px)}}@keyframes ribbon-think-right{0%,100%{transform:rotate(-37deg) translateY(8px)}50%{transform:rotate(-27deg) translateY(3px)}}@keyframes ribbon-cheer-left{0%,100%{transform:rotate(12deg) translateY(-2px)}50%{transform:rotate(-25deg) translateY(-18px)}}@keyframes ribbon-cheer-right{0%,100%{transform:rotate(-12deg) translateY(-2px)}50%{transform:rotate(25deg) translateY(-18px)}}@keyframes ribbon-error-left{0%,100%{transform:rotate(36deg) translate(0,8px)}50%{transform:rotate(28deg) translate(-4px,5px)}}@keyframes ribbon-error-right{0%,100%{transform:rotate(-18deg) translate(0,-1px)}50%{transform:rotate(-31deg) translate(5px,5px)}}
@media(max-width:930px){.layout{grid-template-columns:1fr}.stage{height:650px}}@media(max-width:650px){main{padding:15px}.stage{height:540px}.scene{scale:.78}.buttons{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body><main><h1>Lantern Inky — Mood Rig V1</h1><p class="lead">Transparent layered prototype using light, expression, scarf movement, and comic glow behavior.</p><div class="layout">
<section class="stage" id="stage" data-state="idle"><div class="scene" id="scene"><div class="effects-back"><img class="fx halo" src="assets/halo.png" alt=""><img class="fx sparks" src="assets/sparks.png" alt=""><img class="fx broken" src="assets/broken_halo.png" alt=""></div><div class="character"><img class="part body" src="assets/body_blank.png" alt="Lantern Inky"><img class="part inner-glow" src="assets/inner_glow.png" alt=""><div class="scarf-system" aria-hidden="true"><div class="ribbon ribbon-left"></div><div class="ribbon ribbon-right"></div><div class="neck-band"></div><div class="clasp"></div></div><img class="part eye eye-left" src="assets/eye_left.png" alt=""><img class="part eye eye-right" src="assets/eye_right.png" alt=""><img class="part lid lid-left" src="assets/lid_left.png" alt=""><img class="part lid lid-right" src="assets/lid_right.png" alt=""><img class="part mouth mouth-smile active" data-mouth="smile" src="assets/mouth_smile.png" alt=""><img class="part mouth mouth-open" data-mouth="open" src="assets/mouth_open.png" alt=""><img class="part mouth mouth-o" data-mouth="o" src="assets/mouth_o.png" alt=""><img class="part mouth mouth-frown" data-mouth="frown" src="assets/mouth_frown.png" alt=""></div><div class="effects-front"><img class="fx beam" src="assets/beam.png" alt=""></div></div></section>
<aside class="controls"><h2>Mood States</h2><div class="buttons"><button class="active" data-state="idle">Idle</button><button data-state="hover">Hover</button><button data-state="opened">Opened</button><button data-state="listening">Listening</button><button data-state="thinking">Thinking</button><button data-state="found">Found Something</button><button data-state="success">Success</button><button data-state="help">Needs Help</button><button data-state="error">Error</button><button data-state="offline">Offline</button></div><div class="status" id="status">Idle — a warm steady glow and slow halo breathe quietly.</div></aside>
</div></main><script>
const moods={idle:['smile','Idle — a warm steady glow and slow halo breathe quietly.'],hover:['smile','Hover — a curious translucent spotlight searches in front of Lantern.'],opened:['open','Opened — a welcoming pulse and sparks brighten the greeting.'],listening:['smile','Listening — expanding light rings settle into a quiet rhythm.'],thinking:['o','Thinking — a rotating foreground search beam and asymmetrical ribbons inspect the story.'],found:['open','Found Something — one focused foreground beam locks onto the useful detail.'],success:['open','Success — Lantern bounces while both ribbons lift into celebration.'],help:['frown','Needs Help — the glow hesitates and the ribbons droop.'],error:['o','Error — harmless sparks sputter while the ribbons jitter unevenly.'],offline:['smile','Offline — the face sleeps while both ribbon tails hang downward.']};
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),status=document.getElementById('status'),mouths=[...document.querySelectorAll('[data-mouth]')],eyes=[...document.querySelectorAll('.eye')];
function setState(state,button){stage.dataset.state=state;status.textContent=moods[state][1];mouths.forEach(m=>m.classList.toggle('active',m.dataset.mouth===moods[state][0]));document.querySelectorAll('button[data-state]').forEach(b=>b.classList.toggle('active',b===button))}
document.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>setState(button.dataset.state,button)));
stage.addEventListener('pointermove',event=>{if(stage.dataset.state==='offline'||stage.dataset.state==='error')return;const r=scene.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(event.clientX-r.left-r.width/2)/(r.width/2))),y=Math.max(-1,Math.min(1,(event.clientY-r.top-r.height/2)/(r.height/2)));eyes.forEach(eye=>eye.style.transform='translate('+(x*5)+'px,'+(y*4)+'px)')});stage.addEventListener('pointerleave',()=>eyes.forEach(eye=>eye.style.transform=''));
</script></body></html>
