---
deployment:
  tasks:
    - export DEPLOYPATH=/home/toinkyadmin/public_html/
    - /opt/cpanel/ea-php84/root/usr/bin/php tools/deploy_htaccess.php $DEPLOYPATH
    - /bin/cp -f index.php page-builder.php media.php install.php admin.php ai-settings.php lab.php lobby.php lobby-state.php play.php writer.php profile.php inky-status.php inky-preferences.php inky-action.php inky-starter.php theme-media.php brand-fonts.php captcha-image.php stripe-webhook.php simulate_2fa.php $DEPLOYPATH
    - /bin/rm -f $DEPLOYPATH/security-ai.php
    - /bin/chmod 0644 $DEPLOYPATH/index.php $DEPLOYPATH/page-builder.php $DEPLOYPATH/media.php $DEPLOYPATH/install.php $DEPLOYPATH/admin.php $DEPLOYPATH/ai-settings.php $DEPLOYPATH/lab.php $DEPLOYPATH/lobby.php $DEPLOYPATH/lobby-state.php $DEPLOYPATH/play.php $DEPLOYPATH/profile.php $DEPLOYPATH/inky-status.php $DEPLOYPATH/inky-preferences.php $DEPLOYPATH/inky-action.php $DEPLOYPATH/inky-starter.php $DEPLOYPATH/theme-media.php $DEPLOYPATH/brand-fonts.php $DEPLOYPATH/captcha-image.php $DEPLOYPATH/stripe-webhook.php $DEPLOYPATH/simulate_2fa.php
    - /bin/cp -Rf app $DEPLOYPATH
    - /bin/cp -Rf public $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/cp -Rf public/assets/. $DEPLOYPATH/assets/
    - /bin/rm -rf $DEPLOYPATH/public/assets/genre-themes $DEPLOYPATH/assets/genre-themes $DEPLOYPATH/public/assets/parallax $DEPLOYPATH/assets/parallax
    - /bin/cp -Rf database $DEPLOYPATH
    - /bin/cp -Rf tools $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/config
    - /bin/cp -f config/database.example.php $DEPLOYPATH/config/database.example.php
    - /opt/cpanel/ea-php84/root/usr/bin/php $DEPLOYPATH/tools/migrate.php
