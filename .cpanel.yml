---
deployment:
  tasks:
    - export DEPLOYPATH=/home/sixpillarsadmin/game2.sixpillarsmodel.com/
    - /bin/cp -f index.php install.php admin.php lab.php lobby.php lobby-state.php play.php writer.php $DEPLOYPATH
    - /bin/chmod 0644 $DEPLOYPATH/index.php $DEPLOYPATH/install.php $DEPLOYPATH/admin.php $DEPLOYPATH/lab.php $DEPLOYPATH/lobby.php $DEPLOYPATH/lobby-state.php $DEPLOYPATH/play.php $DEPLOYPATH/writer.php
    - /bin/cp -Rf app $DEPLOYPATH
    - /bin/cp -Rf public $DEPLOYPATH
    - /bin/cp -Rf database $DEPLOYPATH
    - /bin/cp -Rf tools $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/config
    - /bin/cp -f config/database.example.php $DEPLOYPATH/config/database.example.php
