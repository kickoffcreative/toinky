---
deployment:
  tasks:
    - export DEPLOYPATH=/home/toinkyadmin/public_html/
    - /opt/cpanel/ea-php84/root/usr/bin/php tools/deploy_htaccess.php $DEPLOYPATH
    - /bin/cp -f index.php page-builder.php media.php install.php admin.php ai-settings.php lab.php lobby.php lobby-state.php play.php writer.php profile.php inky-status.php inky-preferences.php inky-action.php inky-starter.php inky-draft-dependencies.php theme-media.php brand-fonts.php captcha-image.php stripe-webhook.php $DEPLOYPATH
    - /bin/chmod 0644 $DEPLOYPATH/index.php $DEPLOYPATH/page-builder.php $DEPLOYPATH/media.php $DEPLOYPATH/install.php $DEPLOYPATH/admin.php $DEPLOYPATH/ai-settings.php $DEPLOYPATH/lab.php $DEPLOYPATH/lobby.php $DEPLOYPATH/lobby-state.php $DEPLOYPATH/play.php $DEPLOYPATH/profile.php $DEPLOYPATH/inky-status.php $DEPLOYPATH/inky-preferences.php $DEPLOYPATH/inky-action.php $DEPLOYPATH/inky-starter.php $DEPLOYPATH/inky-draft-dependencies.php $DEPLOYPATH/theme-media.php $DEPLOYPATH/brand-fonts.php $DEPLOYPATH/captcha-image.php $DEPLOYPATH/stripe-webhook.php
    - /bin/cp -Rf app $DEPLOYPATH
    - /bin/cp -Rf public $DEPLOYPATH
    # The wholesale public/ copy above also copies public/assets/ into a
    # shadow $DEPLOYPATH/public/assets/ tree that is unreachable via HTTP
    # (.htaccess 404s public/) and is pure dead weight. Remove it; the live
    # asset tree is $DEPLOYPATH/assets/ (populated below) only.
    - /bin/rm -rf $DEPLOYPATH/public/assets
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/cp -Rf public/assets/. $DEPLOYPATH/assets/
    # Remove unoptimized Inky images deleted from the repo (Oct 26 cleanup) —
    # the deploy copies but never deletes, so stale live copies linger otherwise.
    # Inky loads only the optimized/ variants; these are dead weight.
    - /bin/rm -f $DEPLOYPATH/assets/inky/rig/body_base_blank.png $DEPLOYPATH/assets/inky/rig/eye_left_open.png $DEPLOYPATH/assets/inky/rig/eye_right_open.png $DEPLOYPATH/assets/inky/rig/ink_bubble_large.png $DEPLOYPATH/assets/inky/rig/ink_bubbles_cluster.png $DEPLOYPATH/assets/inky/rig/ink_drop_large.png $DEPLOYPATH/assets/inky/rig/ink_drop_mid_1.png $DEPLOYPATH/assets/inky/rig/ink_drop_mid_2.png $DEPLOYPATH/assets/inky/rig/ink_drop_small_1.png $DEPLOYPATH/assets/inky/rig/ink_ring_1.png $DEPLOYPATH/assets/inky/rig/ink_ring_2.png $DEPLOYPATH/assets/inky/rig/ink_ring_3.png $DEPLOYPATH/assets/inky/rig/ink_ring_4.png $DEPLOYPATH/assets/inky/rig/ink_wave_1.png $DEPLOYPATH/assets/inky/rig/ink_wave_2.png $DEPLOYPATH/assets/inky/rig/lid_left.png $DEPLOYPATH/assets/inky/rig/lid_right.png $DEPLOYPATH/assets/inky/rig/mouth_happy.png $DEPLOYPATH/assets/inky/rig/mouth_open.png $DEPLOYPATH/assets/inky/rig/mouth_small_o.png $DEPLOYPATH/assets/inky/rig/pen_arm.png $DEPLOYPATH/assets/inky/rig/scarf_full.png
    - /bin/rm -f $DEPLOYPATH/assets/inky/lantern/rig/body_blank.png $DEPLOYPATH/assets/inky/lantern/rig/broken_halo.png $DEPLOYPATH/assets/inky/lantern/rig/cape_left.png $DEPLOYPATH/assets/inky/lantern/rig/cape_right.png $DEPLOYPATH/assets/inky/lantern/rig/eye_left.png $DEPLOYPATH/assets/inky/lantern/rig/eye_right.png $DEPLOYPATH/assets/inky/lantern/rig/halo.png $DEPLOYPATH/assets/inky/lantern/rig/inner_glow.png $DEPLOYPATH/assets/inky/lantern/rig/lid_left.png $DEPLOYPATH/assets/inky/lantern/rig/lid_right.png $DEPLOYPATH/assets/inky/lantern/rig/mouth_o.png $DEPLOYPATH/assets/inky/lantern/rig/mouth_open.png $DEPLOYPATH/assets/inky/lantern/rig/mouth_smile.png $DEPLOYPATH/assets/inky/lantern/rig/scarf.png $DEPLOYPATH/assets/inky/lantern/rig/sparks.png
    - /bin/rm -rf $DEPLOYPATH/assets/inky/lantern/source
    - /bin/cp -Rf database $DEPLOYPATH
    - /bin/cp -Rf tools $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/config
    - /bin/cp -f config/database.example.php $DEPLOYPATH/config/database.example.php
    # Verify the deploy against the repo manifest and delete stale files
    # (code first, migrations last). The manifest never deletes
    # config/database.php, .installed, or public/uploads/.
    - /opt/cpanel/ea-php84/root/usr/bin/php tools/deploy_manifest.php $DEPLOYPATH --apply
    - /opt/cpanel/ea-php84/root/usr/bin/php $DEPLOYPATH/tools/migrate.php
