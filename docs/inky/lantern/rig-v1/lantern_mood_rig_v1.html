<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern Inky Mood Rig V1</title>
<style>
:root{--wine:#6b2938;--ink:#25272a;--paper:#fffaf0}*{box-sizing:border-box}
body{margin:0;background:#f5efe3;color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}
h1{margin:0;color:var(--wine);font:700 34px/1.1 Georgia,serif}.lead{margin:7px 0 22px;color:#687078}
.layout{display:grid;grid-template-columns:minmax(590px,1fr) 320px;gap:24px}.stage{position:relative;height:680px;overflow:hidden;border:1px solid #d6c6aa;border-radius:28px;background:radial-gradient(circle at 50% 48%,#fffdf7 0,#f8f1e4 58%,#ecdfca 100%);box-shadow:inset 0 0 0 1px #fff9}
.scene{position:absolute;width:600px;height:600px;left:50%;top:50%;translate:-50% -50%}.part,.fx{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none}
.effects-back{position:absolute;inset:0;z-index:2}.effects-front{position:absolute;inset:0;z-index:14;pointer-events:none}.fx{opacity:0;transition:opacity .25s ease}
.character{position:absolute;inset:0;z-index:4;transform-origin:50% 73%;animation:float 4s ease-in-out infinite}.body{width:300px;left:150px;top:18px;filter:drop-shadow(0 18px 15px #5c3f2026)}
.inner-glow{z-index:5;width:180px;left:210px;top:216px;opacity:.2;mix-blend-mode:screen;animation:glow 3.4s ease-in-out infinite}
.scarf-system{position:absolute;left:150px;top:294px;width:300px;height:172px;z-index:8;overflow:visible;pointer-events:none;filter:drop-shadow(0 5px 3px #071d1a2b)}
.scarf-system .band,.scarf-system .clasp,.scarf-system .ribbon-left,.scarf-system .ribbon-right{transform-box:fill-box;transition:transform .48s cubic-bezier(.2,.82,.25,1),opacity .25s ease}
.scarf-system .ribbon-left{transform-origin:94% 9%}.scarf-system .ribbon-right{transform-origin:6% 9%}
.eye{z-index:9;top:242px;width:43px;transition:transform .12s ease;animation:eye-blink 4s steps(1,end) infinite}.eye-left{left:254px}.eye-right{left:300px;width:47px}
.lid{z-index:11;width:48px;opacity:0;animation:lid-blink 4s steps(1,end) infinite}.lid-left{left:252px;top:241px}.lid-right{left:300px;top:260px}
.mouth{z-index:10;opacity:0;transition:opacity .12s}.mouth.active{opacity:1}.mouth-smile{width:44px;left:278px;top:313px}.mouth-open{width:46px;left:277px;top:301px}.mouth-o{width:20px;left:290px;top:313px}.mouth-frown{width:46px;left:277px;top:318px}
.halo{width:360px;left:120px;top:112px}.beam{width:240px;left:255px;top:258px;transform-origin:50% 3%;mix-blend-mode:screen;filter:drop-shadow(0 0 10px #ffd96955)}.sparks{width:240px;left:180px;top:105px}.broken{width:330px;left:135px;top:120px;clip-path:inset(48px 0 0)}
.stage[data-state="idle"] .halo{opacity:.2;animation:pulse 3.2s ease-in-out infinite}.stage[data-state="idle"] .ribbon-left{transform:rotate(19deg) translate(-2px,7px)}.stage[data-state="idle"] .ribbon-right{transform:rotate(-19deg) translate(2px,7px)}
.stage[data-state="hover"] .beam{opacity:.34;animation:search 2.6s ease-in-out infinite}.stage[data-state="hover"] .ribbon-left{transform:rotate(7deg) translate(-2px,0)}.stage[data-state="hover"] .ribbon-right{transform:rotate(-27deg) translate(1px,6px)}
.stage[data-state="opened"] .halo{width:470px;left:65px;top:55px;opacity:.78;animation:pop .7s ease-out}.stage[data-state="opened"] .sparks{width:285px;left:158px;top:85px;opacity:.72;animation:rise 2.8s ease-in infinite}.stage[data-state="opened"] .ribbon-left{transform:rotate(-8deg) translate(-4px,-7px)}.stage[data-state="opened"] .ribbon-right{transform:rotate(8deg) translate(4px,-7px)}
.stage[data-state="listening"] .halo{opacity:.52;animation:listening 2s ease-out infinite}.stage[data-state="listening"] .ribbon-left{transform:rotate(25deg) translate(-1px,10px)}.stage[data-state="listening"] .ribbon-right{transform:rotate(-25deg) translate(1px,10px)}
.stage[data-state="thinking"] .beam{width:255px;left:250px;top:255px;opacity:.42;animation:scan 2s ease-in-out infinite}.stage[data-state="thinking"] .sparks{width:390px;left:105px;top:20px;opacity:.68;animation:orbit 3.3s linear infinite}.stage[data-state="thinking"] .ribbon-left{animation:ribbon-think-left 2.2s ease-in-out infinite}.stage[data-state="thinking"] .ribbon-right{animation:ribbon-think-right 2.2s ease-in-out infinite}
.stage[data-state="found"] .beam{opacity:.48;transform:rotate(-84deg)}.stage[data-state="found"] .sparks{opacity:.75;animation:pop .55s ease-out}.stage[data-state="found"] .ribbon-left{transform:rotate(-15deg) translate(-5px,-10px)}.stage[data-state="found"] .ribbon-right{transform:rotate(-20deg) translate(2px,5px)}
.stage[data-state="success"] .halo{opacity:1;animation:success .75s ease-out 2}.stage[data-state="success"] .sparks{opacity:1;animation:rise 1.8s ease-in infinite}.stage[data-state="success"] .character{animation:bounce .8s ease-out 2}.stage[data-state="success"] .ribbon-left{animation:ribbon-cheer-left .8s ease-out 2}.stage[data-state="success"] .ribbon-right{animation:ribbon-cheer-right .8s ease-out 2}
.stage[data-state="help"] .broken{opacity:.55;animation:wobble 2.1s ease-in-out infinite}.stage[data-state="help"] .inner-glow{animation:flicker 2.2s steps(1) infinite}.stage[data-state="help"] .ribbon-left{transform:rotate(39deg) translate(0,15px)}.stage[data-state="help"] .ribbon-right{transform:rotate(-39deg) translate(0,15px)}
.stage[data-state="error"] .broken{opacity:.85;filter:hue-rotate(320deg) saturate(1.2);animation:jitter .65s ease-in-out infinite}.stage[data-state="error"] .inner-glow{width:210px;left:195px;top:205px;animation:sputter .8s steps(1) infinite}.stage[data-state="error"] .eye-left{transform:rotate(9deg) translateX(5px)}.stage[data-state="error"] .eye-right{transform:rotate(-9deg) translateX(-5px)}.stage[data-state="error"] .ribbon-left{animation:ribbon-error-left .55s ease-in-out infinite}.stage[data-state="error"] .ribbon-right{animation:ribbon-error-right .55s ease-in-out infinite}
.stage[data-state="offline"] .body,.stage[data-state="offline"] .scarf-system{filter:grayscale(.45) brightness(.62)}.stage[data-state="offline"] .eye{opacity:.08;animation:none}.stage[data-state="offline"] .lid{opacity:1;animation:none}.stage[data-state="offline"] .inner-glow{opacity:.08;animation:none}.stage[data-state="offline"] .ribbon-left{transform:rotate(48deg) translate(2px,23px)}.stage[data-state="offline"] .ribbon-right{transform:rotate(-48deg) translate(-2px,23px)}
.controls{padding:18px;border:1px solid #d2c3aa;border-radius:20px;background:var(--paper);box-shadow:0 12px 30px #49372a12}.controls h2{margin:0 0 12px;color:var(--wine);font:700 22px Georgia,serif}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{padding:10px;border:1px solid #bca77f;border-radius:9px;background:#fff;color:#35272b;font-weight:750;text-align:left;cursor:pointer}button:hover{background:#f7efe5}button.active{border-color:var(--wine);background:var(--wine);color:#fff}.status{margin-top:14px;padding:13px;border-radius:12px;background:#f2eadc;color:#5c6670;font-size:13px;line-height:1.45}
@keyframes eye-blink{0%,42%,58%,100%{opacity:1}43%,57%{opacity:0}}@keyframes lid-blink{0%,42%,58%,100%{opacity:0}43%,57%{opacity:1}}@keyframes float{0%,100%{transform:translateY(3px) rotate(-.25deg)}50%{transform:translateY(-7px) rotate(.4deg)}}@keyframes glow{0%,100%{opacity:.16;scale:.96}50%{opacity:.31;scale:1.03}}@keyframes pulse{0%,100%{scale:.88;opacity:.14}50%{scale:1.04;opacity:.35}}@keyframes search{0%,100%{transform:rotate(-102deg)}50%{transform:rotate(-70deg)}}@keyframes scan{0%,100%{transform:rotate(-114deg)}50%{transform:rotate(-56deg)}}@keyframes pop{0%{scale:.5;opacity:0}70%{scale:1.08}100%{scale:1}}@keyframes rise{0%{translate:0 18px;opacity:.1}50%{opacity:1}100%{translate:0 -24px;opacity:0}}@keyframes orbit{to{rotate:360deg}}@keyframes listening{0%{scale:.75;opacity:.12}65%{opacity:.65}100%{scale:1.13;opacity:0}}@keyframes success{0%{scale:.7;opacity:.2}60%{scale:1.15;opacity:1}100%{scale:1;opacity:.7}}@keyframes bounce{0%,100%{transform:none}45%{transform:translateY(-16px) scale(1.035)}75%{transform:translateY(2px) scale(.99)}}@keyframes wobble{0%,100%{rotate:-6deg;scale:.92}50%{rotate:7deg;scale:1.02}}@keyframes flicker{0%,100%{opacity:.18}35%{opacity:.05}42%{opacity:.3}70%{opacity:.11}}@keyframes jitter{0%,100%{translate:-3px 0;rotate:-2deg}50%{translate:4px 1px;rotate:3deg}}@keyframes sputter{0%,100%{opacity:.28}25%{opacity:.03}35%{opacity:.34}55%{opacity:.06}65%{opacity:.2}}@keyframes ribbon-think-left{0%,100%{transform:rotate(14deg) translate(0,5px)}50%{transform:rotate(2deg) translate(-3px,-3px)}}@keyframes ribbon-think-right{0%,100%{transform:rotate(-31deg) translate(1px,11px)}50%{transform:rotate(-20deg) translate(3px,5px)}}@keyframes ribbon-cheer-left{0%,100%{transform:rotate(6deg) translate(-2px,0)}50%{transform:rotate(-31deg) translate(-7px,-20px)}}@keyframes ribbon-cheer-right{0%,100%{transform:rotate(-6deg) translate(2px,0)}50%{transform:rotate(31deg) translate(7px,-20px)}}@keyframes ribbon-error-left{0%,100%{transform:rotate(31deg) translate(0,10px)}50%{transform:rotate(22deg) translate(-5px,5px)}}@keyframes ribbon-error-right{0%,100%{transform:rotate(-14deg) translate(0,2px)}50%{transform:rotate(-28deg) translate(5px,8px)}}
@media(max-width:930px){.layout{grid-template-columns:1fr}.stage{height:650px}}@media(max-width:650px){main{padding:15px}.stage{height:540px}.scene{scale:.78}.buttons{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body><main><h1>Lantern Inky — Mood Rig V1</h1><p class="lead">Layered prototype with a true front neck band, independent ribbon tails, foreground light, and mood-specific poses.</p><div class="layout">
<section class="stage" id="stage" data-state="idle"><div class="scene" id="scene">
<div class="effects-back"><img class="fx halo" src="assets/halo.png" alt=""><img class="fx sparks" src="assets/sparks.png" alt=""><img class="fx broken" src="assets/broken_halo.png" alt=""></div>
<div class="character"><img class="part body" src="assets/body_blank.png" alt="Lantern Inky"><img class="part inner-glow" src="assets/inner_glow.png" alt="">
<svg class="scarf-system" viewBox="0 0 300 172" aria-hidden="true">
<defs>
<linearGradient id="bandPaint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064e49"/><stop offset=".23" stop-color="#0d7464"/><stop offset=".38" stop-color="#9bad3c"/><stop offset=".49" stop-color="#d6ca36"/><stop offset=".61" stop-color="#13765f"/><stop offset="1" stop-color="#063f42"/></linearGradient>
<linearGradient id="ribbonPaint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a655b"/><stop offset=".27" stop-color="#178068"/><stop offset=".42" stop-color="#b3b93c"/><stop offset=".53" stop-color="#ddd139"/><stop offset=".66" stop-color="#19755e"/><stop offset="1" stop-color="#063f42"/></linearGradient>
<radialGradient id="goldPaint" cx="34%" cy="28%" r="72%"><stop offset="0" stop-color="#fff3a1"/><stop offset=".13" stop-color="#ffd13c"/><stop offset=".38" stop-color="#e79c0a"/><stop offset=".66" stop-color="#a95d04"/><stop offset=".82" stop-color="#f0b416"/><stop offset="1" stop-color="#754004"/></radialGradient>
<filter id="watercolor" x="-10%" y="-15%" width="120%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".035 .07" numOctaves="3" seed="11" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray" result="soft"><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer><feBlend in="SourceGraphic" in2="soft" mode="multiply"/></filter>
</defs>
<g class="ribbon-left" filter="url(#watercolor)"><path d="M143 74 C128 82 112 94 98 113 C88 126 78 141 66 153 C84 154 103 148 119 138 C132 130 143 119 151 104 Z" fill="url(#ribbonPaint)" stroke="#061d1b" stroke-width="5" stroke-linejoin="round"/><path d="M137 83 C120 102 104 122 82 143" fill="none" stroke="#d7cc39" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/></g>
<g class="ribbon-right" filter="url(#watercolor)"><path d="M157 74 C172 82 188 94 202 113 C212 126 222 141 234 153 C216 154 197 148 181 138 C168 130 157 119 149 104 Z" fill="url(#ribbonPaint)" stroke="#061d1b" stroke-width="5" stroke-linejoin="round"/><path d="M163 83 C180 102 196 122 218 143" fill="none" stroke="#d7cc39" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/></g>
<g class="band" filter="url(#watercolor)"><path d="M28 28 C71 15 229 15 272 28 C277 39 277 56 269 72 C220 84 80 84 31 72 C23 56 23 39 28 28 Z" fill="url(#bandPaint)" stroke="#061d1b" stroke-width="6" stroke-linejoin="round"/><path d="M42 35 C94 26 207 26 258 35" fill="none" stroke="#e1d73d" stroke-opacity=".56" stroke-width="8" stroke-linecap="round"/><path d="M39 61 C101 71 205 70 263 60" fill="none" stroke="#063f42" stroke-opacity=".58" stroke-width="9" stroke-linecap="round"/></g>
<g class="clasp"><circle cx="150" cy="72" r="32" fill="url(#goldPaint)" stroke="#311d03" stroke-width="5"/><circle cx="150" cy="72" r="21" fill="none" stroke="#754204" stroke-width="4"/><circle cx="150" cy="72" r="11" fill="#d99608" stroke="#4e2b03" stroke-width="3"/><circle cx="146" cy="67" r="3.5" fill="#fff3a3" opacity=".9"/></g>
</svg>
<img class="part eye eye-left" src="assets/eye_left.png" alt=""><img class="part eye eye-right" src="assets/eye_right.png" alt=""><img class="part lid lid-left" src="assets/lid_left.png" alt=""><img class="part lid lid-right" src="assets/lid_right.png" alt=""><img class="part mouth mouth-smile active" data-mouth="smile" src="assets/mouth_smile.png" alt=""><img class="part mouth mouth-open" data-mouth="open" src="assets/mouth_open.png" alt=""><img class="part mouth mouth-o" data-mouth="o" src="assets/mouth_o.png" alt=""><img class="part mouth mouth-frown" data-mouth="frown" src="assets/mouth_frown.png" alt=""></div>
<div class="effects-front"><img class="fx beam" src="assets/beam.png" alt=""></div>
</div></section>
<aside class="controls"><h2>Mood States</h2><div class="buttons"><button class="active" data-state="idle">Idle</button><button data-state="hover">Hover</button><button data-state="opened">Opened</button><button data-state="listening">Listening</button><button data-state="thinking">Thinking</button><button data-state="found">Found Something</button><button data-state="success">Success</button><button data-state="help">Needs Help</button><button data-state="error">Error</button><button data-state="offline">Offline</button></div><div class="status" id="status">Idle — ribbons rest naturally downward while the halo breathes.</div></aside>
</div></main><script>
const moods={idle:['smile','Idle — ribbons rest naturally downward while the halo breathes.'],hover:['smile','Hover — one ribbon perks up while the foreground light searches.'],opened:['open','Opened — both ribbons flare outward in a welcoming reaction.'],listening:['smile','Listening — both ribbons settle lower and stay calm.'],thinking:['o','Thinking — the ribbons become asymmetrical while the search beam scans.'],found:['open','Found Something — one ribbon snaps upward with the focused beam.'],success:['open','Success — both ribbons kick upward during the celebration.'],help:['frown','Needs Help — both ribbons droop with the hesitant glow.'],error:['o','Error — the ribbons jitter unevenly while the light sputters.'],offline:['smile','Offline — both ribbons hang fully down and the chamber dims.']};
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),status=document.getElementById('status'),mouths=[...document.querySelectorAll('[data-mouth]')],eyes=[...document.querySelectorAll('.eye')];
function setState(state,button){stage.dataset.state=state;status.textContent=moods[state][1];mouths.forEach(m=>m.classList.toggle('active',m.dataset.mouth===moods[state][0]));document.querySelectorAll('button[data-state]').forEach(b=>b.classList.toggle('active',b===button))}
document.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>setState(button.dataset.state,button)));
stage.addEventListener('pointermove',event=>{if(stage.dataset.state==='offline'||stage.dataset.state==='error')return;const r=scene.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(event.clientX-r.left-r.width/2)/(r.width/2))),y=Math.max(-1,Math.min(1,(event.clientY-r.top-r.height/2)/(r.height/2)));eyes.forEach(eye=>eye.style.transform='translate('+(x*5)+'px,'+(y*4)+'px)')});stage.addEventListener('pointerleave',()=>eyes.forEach(eye=>eye.style.transform=''));
</script></body></html>
