name: PHP validation
on:
  push:
    branches: [main, feature/multiplayer-lobby]
  pull_request:
    branches: [main]
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
      - name: Lint PHP
        run: find app public tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
  multiplayer-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: game2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
      - name: Normalize test database collation
        env:
          GAME2_DATABASE_CONFIG: ${{ github.workspace }}/config/database.test.php
        run: php -r '$c=require getenv("GAME2_DATABASE_CONFIG");$p=new PDO($c["dsn"],$c["username"],$c["password"]);$p->exec("ALTER DATABASE game2 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
      - name: Build database and run engine baseline
        env:
          GAME2_DATABASE_CONFIG: ${{ github.workspace }}/config/database.test.php
          GAME2_SIM_NPC_REASONER: weighted
        run: php tools/simulate.php --reset --runs=1 --plot=EMPTY_THRONE --strategy=no-action --npc-reasoner=weighted
      - name: Validate published story structures
        env:
          GAME2_DATABASE_CONFIG: ${{ github.workspace }}/config/database.test.php
        run: |
          php tools/story_immersion_audit.php EMPTY_THRONE | tee /tmp/empty-throne-audit.txt
          php tools/story_immersion_audit.php CONCEALED_FAILURE | tee /tmp/concealed-failure-audit.txt
          ! grep -q '^FAIL | P0 | Dependency and authoring structure' /tmp/empty-throne-audit.txt
          ! grep -q '^FAIL | P0 | Dependency and authoring structure' /tmp/concealed-failure-audit.txt
      - name: Validate story review safeguards and batch modes
        env:
          GAME2_DATABASE_CONFIG: ${{ github.workspace }}/config/database.test.php
          GAME2_AI_PROVIDER: deterministic
          GAME2_SIM_NPC_REASONER: weighted
        run: |
          php tools/story_correction_guard_test.php
          php tools/story_correction_v2_guard_test.php
          php tools/simulation_mode_smoke.php
          php tools/story_writer_stable_code_test.php
          php tools/story_value_type_guard_test.php
          php tools/story_media_attachment_edit_test.php
          php tools/story_condition_status_test.php
          php tools/story_writer_choice_test.php
          php tools/story_choice_effect_status_test.php
          php tools/story_character_decision_status_test.php
          php tools/story_simulation_batch_resume_test.php
          php tools/story_focused_opportunity_simulation_test.php
      - name: Test multiplayer lifecycle
        env:
          GAME2_DATABASE_CONFIG: ${{ github.workspace }}/config/database.test.php
          GAME2_SIM_NPC_REASONER: weighted
        run: php tools/multiplayer_smoke.php
