<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern Inky Mood Rig V1</title>
<style>
:root{--wine:#6b2938;--ink:#25272a;--paper:#fffaf0}*{box-sizing:border-box}
body{margin:0;background:#f5efe3;color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}
h1{margin:0;color:var(--wine);font:700 34px/1.1 Georgia,serif}.lead{margin:7px 0 22px;color:#687078}
.layout{display:grid;grid-template-columns:minmax(590px,1fr) 320px;gap:24px}.stage{position:relative;height:680px;overflow:hidden;border:1px solid #d6c6aa;border-radius:28px;background:radial-gradient(circle at 50% 48%,#fffdf7 0,#f8f1e4 58%,#ecdfca 100%);box-shadow:inset 0 0 0 1px #fff9}
.scene{position:absolute;width:600px;height:600px;left:50%;top:calc(50% + 12px);translate:-50% -50%;scale:.94}.part,.fx{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none}
.effects-back{position:absolute;inset:0;z-index:2}.effects-front{position:absolute;inset:0;z-index:14;pointer-events:none}.fx{opacity:0;transition:opacity .25s ease}
.character{position:absolute;inset:0;z-index:4;transform-origin:50% 73%;animation:float 4s ease-in-out infinite}.body{width:300px;left:150px;top:18px;filter:drop-shadow(0 18px 15px #5c3f2026)}
.inner-glow{z-index:5;width:180px;left:210px;top:216px;opacity:.2;mix-blend-mode:screen;animation:glow 3.4s ease-in-out infinite}
.scarf{position:absolute;left:205px;top:338px;width:190px;height:92px;z-index:8;transform-origin:50% 18%;pointer-events:none;filter:drop-shadow(0 5px 3px #071d1a2b);transition:filter .25s ease}
.scarf-cape{position:absolute;top:322px;width:185px;height:auto;z-index:7;pointer-events:none;filter:drop-shadow(0 5px 3px #071d1a2b);transform-origin:100% 48%;transition:filter .25s ease}.scarf-cape-left{left:145px;top:342px;transform-origin:100% 48%}.scarf-cape-right{left:300px;transform-origin:0 48%}
.eye{z-index:9;top:242px;width:43px;transition:transform .12s ease;animation:eye-blink 4s steps(1,end) infinite}.eye-left{left:254px}.eye-right{left:300px;top:246px;width:47px}
.lid{z-index:11;width:48px;opacity:0;animation:lid-blink 4s steps(1,end) infinite}.lid-left{left:252px;top:241px}.lid-right{left:300px;top:267px}
.mouth{z-index:10;opacity:0;transition:opacity .12s}.mouth.active{opacity:1}.mouth-smile{width:44px;left:276px;top:313px}.mouth-open{width:46px;left:283px;top:301px}.mouth-o{width:20px;left:290px;top:313px}.mouth-frown{width:46px;left:270px;top:318px}
.halo{width:360px;left:120px;top:112px}.beam{width:240px;left:255px;top:258px;transform-origin:50% 3%;mix-blend-mode:screen;filter:drop-shadow(0 0 10px #ffd96955)}.sparks{width:240px;left:180px;top:105px}.broken{width:330px;left:135px;top:120px;clip-path:inset(48px 0 0)}
.stage[data-state="idle"] .halo{opacity:.2;animation:pulse 3.2s ease-in-out infinite}.stage[data-state="idle"] .scarf{animation:scarf-idle 4.2s ease-in-out infinite}
.stage[data-state="hover"] .beam{opacity:.34;animation:search 2.6s ease-in-out infinite}.stage[data-state="hover"] .scarf{animation:scarf-hover 1.55s ease-in-out infinite}
.stage[data-state="opened"] .halo{width:470px;left:65px;top:55px;opacity:.78;animation:pop .7s ease-out}.stage[data-state="opened"] .sparks{width:285px;left:158px;top:85px;opacity:.72;animation:rise 2.8s ease-in-out infinite}.stage[data-state="opened"] .scarf{animation:scarf-opened 1.4s ease-out 2}
.stage[data-state="listening"] .halo{opacity:.52;animation:listening 2s ease-out infinite}.stage[data-state="listening"] .scarf{animation:scarf-listening 2.6s ease-in-out infinite}
.stage[data-state="thinking"] .beam{width:255px;left:250px;top:255px;opacity:.42;animation:scan 2s ease-in-out infinite}.stage[data-state="thinking"] .sparks{width:300px;left:150px;top:82px;opacity:.68;animation:orbit 3.3s ease-in-out infinite}.stage[data-state="thinking"] .scarf{animation:scarf-thinking 1.7s ease-in-out infinite}.stage[data-state="thinking"] .scarf-cape-left{transform:rotate(-6deg) translateY(8px)}
.stage[data-state="found"] .beam{opacity:.48;transform:rotate(-84deg)}.stage[data-state="found"] .sparks{opacity:.75;animation:pop .55s ease-out}.stage[data-state="found"] .scarf{animation:scarf-found 1.1s ease-out 2}
.stage[data-state="success"] .halo{opacity:1;animation:success .75s ease-out 2}.stage[data-state="success"] .sparks{opacity:1;animation:rise 1.8s ease-in infinite}.stage[data-state="success"] .character{animation:bounce .8s ease-out 2}.stage[data-state="success"] .scarf{animation:scarf-cheer .8s ease-out 2}
.stage[data-state="help"] .broken{opacity:.55;animation:wobble 2.1s ease-in-out infinite}.stage[data-state="help"] .inner-glow{animation:flicker 2.2s steps(1) infinite}.stage[data-state="help"] .scarf{animation:scarf-help 2.4s ease-in-out infinite}
.stage[data-state="idle"] .scarf-cape-left{animation:cape-left-idle 4.4s ease-in-out infinite}.stage[data-state="idle"] .scarf-cape-right{animation:cape-right-idle 4.1s ease-in-out infinite}.stage[data-state="hover"] .scarf-cape-left{animation:cape-left-hover 1.8s ease-in-out infinite}.stage[data-state="hover"] .scarf-cape-right{animation:cape-right-hover 1.6s ease-in-out infinite}.stage[data-state="opened"] .scarf-cape-left{animation:cape-left-opened 1.2s ease-out 2}.stage[data-state="opened"] .scarf-cape-right{animation:cape-right-opened 1.35s ease-out 2}.stage[data-state="thinking"] .scarf-cape-left{animation:cape-left-thinking 1.7s ease-in-out infinite}.stage[data-state="thinking"] .scarf-cape-right{animation:cape-right-thinking 1.45s ease-in-out infinite}.stage[data-state="success"] .scarf-cape-left{animation:cape-left-cheer .8s ease-out 2}.stage[data-state="success"] .scarf-cape-right{animation:cape-right-cheer .95s ease-out 2}.stage[data-state="help"] .scarf-cape-left{animation:cape-left-help 2.2s ease-in-out infinite}.stage[data-state="help"] .scarf-cape-right{animation:cape-right-help 2.5s ease-in-out infinite}.stage[data-state="error"] .scarf-cape-left{animation:cape-left-error .6s steps(2) infinite}.stage[data-state="error"] .scarf-cape-right{animation:cape-right-error .72s steps(2) infinite}.stage[data-state="offline"] .scarf-cape-left,.stage[data-state="offline"] .scarf-cape-right{animation:none;filter:grayscale(.45) brightness(.62);transform:translateY(8px) rotate(4deg)}
.stage[data-state="error"] .broken{opacity:.85;filter:hue-rotate(320deg) saturate(1.2);animation:jitter .65s ease-in-out infinite}.stage[data-state="error"] .inner-glow{width:180px;left:210px;top:216px;animation:sputter .8s steps(1) infinite}.stage[data-state="error"] .eye-left{transform:rotate(9deg) translateX(5px)}.stage[data-state="error"] .eye-right{transform:rotate(-9deg) translateX(-5px)}.stage[data-state="error"] .scarf{animation:scarf-error .55s steps(2) infinite}
.stage[data-state="offline"] .body,.stage[data-state="offline"] .scarf{filter:grayscale(.45) brightness(.62)}.stage[data-state="offline"] .eye{opacity:.08;animation:none}.stage[data-state="offline"] .lid{opacity:1;animation:none}.stage[data-state="offline"] .inner-glow{opacity:.08;animation:none}.stage[data-state="offline"] .scarf{animation:none;transform:translateY(7px) scaleY(.93) rotate(1.5deg)}
.controls{padding:18px;border:1px solid #d2c3aa;border-radius:20px;background:var(--paper);box-shadow:0 12px 30px #49372a12}.controls h2{margin:0 0 12px;color:var(--wine);font:700 22px Georgia,serif}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{padding:10px;border:1px solid #bca77f;border-radius:9px;background:#fff;color:#35272b;font-weight:750;text-align:left;cursor:pointer}button:hover{background:#f7efe5}button.active{border-color:var(--wine);background:var(--wine);color:#fff}.status{margin-top:14px;padding:13px;border-radius:12px;background:#f2eadc;color:#5c6670;font-size:13px;line-height:1.45}
@keyframes eye-blink{0%,42%,58%,100%{opacity:1}43%,57%{opacity:0}}@keyframes lid-blink{0%,42%,58%,100%{opacity:0}43%,57%{opacity:1}}@keyframes float{0%,100%{transform:translateY(3px) rotate(-.25deg)}50%{transform:translateY(-7px) rotate(.4deg)}}@keyframes glow{0%,100%{opacity:.16;scale:.96}50%{opacity:.31;scale:1.03}}@keyframes pulse{0%,100%{scale:.88;opacity:.14}50%{scale:1.04;opacity:.35}}@keyframes search{0%,100%{transform:rotate(-102deg)}50%{transform:rotate(-70deg)}}@keyframes scan{0%,100%{transform:rotate(-114deg)}50%{transform:rotate(-56deg)}}@keyframes pop{0%{scale:.5;opacity:0}70%{scale:1.08}100%{scale:1}}@keyframes rise{0%{translate:0 18px;opacity:.1}50%{opacity:1}100%{translate:0 -24px;opacity:0}}@keyframes orbit{to{rotate:360deg}}@keyframes listening{0%{scale:.75;opacity:.12}65%{opacity:.65}100%{scale:1.13;opacity:0}}@keyframes success{0%{scale:.7;opacity:.2}60%{scale:1.15;opacity:1}100%{scale:1;opacity:.7}}@keyframes bounce{0%,100%{transform:none}45%{transform:translateY(-16px) scale(1.035)}75%{transform:translateY(2px) scale(.99)}}@keyframes wobble{0%,100%{rotate:-6deg;scale:.92}50%{rotate:7deg;scale:1.02}}@keyframes flicker{0%,100%{opacity:.18}35%{opacity:.05}42%{opacity:.3}70%{opacity:.11}}@keyframes jitter{0%,100%{translate:-3px 0;rotate:-2deg}50%{translate:4px 1px;rotate:3deg}}@keyframes sputter{0%,100%{opacity:.28}25%{opacity:.03}35%{opacity:.34}55%{opacity:.06}65%{opacity:.2}}@keyframes ribbon-think-left{0%,100%{transform:rotate(14deg) translate(0,5px)}50%{transform:rotate(2deg) translate(-3px,-3px)}}@keyframes ribbon-think-right{0%,100%{transform:rotate(-31deg) translate(1px,11px)}50%{transform:rotate(-20deg) translate(3px,5px)}}@keyframes ribbon-cheer-left{0%,100%{transform:rotate(6deg) translate(-2px,0)}50%{transform:rotate(-31deg) translate(-7px,-20px)}}@keyframes ribbon-cheer-right{0%,100%{transform:rotate(-6deg) translate(2px,0)}50%{transform:rotate(31deg) translate(7px,-20px)}}@keyframes ribbon-error-left{0%,100%{transform:rotate(31deg) translate(0,10px)}50%{transform:rotate(22deg) translate(-5px,5px)}}@keyframes ribbon-error-right{0%,100%{transform:rotate(-14deg) translate(0,2px)}50%{transform:rotate(-28deg) translate(5px,8px)}}
@keyframes scarf-idle{0%,100%{transform:rotate(-.7deg) translateY(1px) scale(.99)}50%{transform:rotate(.8deg) translateY(-2px) scale(1.01)}}@keyframes scarf-hover{0%,100%{transform:rotate(-1.4deg) translateX(-2px) scale(.99)}50%{transform:rotate(1.6deg) translateX(2px) translateY(-3px) scale(1.02)}}@keyframes scarf-opened{0%{transform:scale(.92)}55%{transform:translateY(-6px) scale(1.04)}100%{transform:none}}@keyframes scarf-listening{0%,100%{transform:rotate(-.8deg) translateY(2px)}50%{transform:rotate(.8deg) translateY(4px)}}@keyframes scarf-thinking{0%,100%{transform:rotate(-1.4deg) translateX(-2px)}50%{transform:rotate(1.5deg) translateX(2px) translateY(-2px)}}@keyframes scarf-found{0%{transform:translateY(2px) scale(.96)}60%{transform:translateY(-6px) scale(1.04)}100%{transform:none}}@keyframes scarf-cheer{0%,100%{transform:none}45%{transform:translateY(-12px) rotate(-3deg) scale(1.04)}75%{transform:translateY(2px) rotate(2deg) scale(.99)}}@keyframes scarf-help{0%,100%{transform:translateY(4px) rotate(-1.4deg)}50%{transform:translateY(7px) rotate(1.4deg) scale(.98)}}@keyframes scarf-error{0%,100%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(3px) rotate(1deg)}}
@keyframes scarf-idle{0%,100%{transform:rotate(-.7deg) translateY(1px) scale(.99)}50%{transform:rotate(.8deg) translateY(-2px) scale(1.01)}}@keyframes scarf-hover{0%,100%{transform:rotate(-1.4deg) translateX(-2px) scale(.99)}50%{transform:rotate(1.6deg) translateX(2px) translateY(-3px) scale(1.02)}}@keyframes scarf-opened{0%{transform:scale(.92)}55%{transform:translateY(-6px) scale(1.04)}100%{transform:none}}@keyframes scarf-listening{0%,100%{transform:rotate(-.8deg) translateY(2px)}50%{transform:rotate(.8deg) translateY(4px)}}@keyframes scarf-thinking{0%,100%{transform:rotate(-1.4deg) translateX(-2px)}50%{transform:rotate(1.5deg) translateX(2px) translateY(-2px)}}@keyframes scarf-found{0%{transform:translateY(2px) scale(.96)}60%{transform:translateY(-6px) scale(1.04)}100%{transform:none}}@keyframes scarf-cheer{0%,100%{transform:none}45%{transform:translateY(-12px) rotate(-3deg) scale(1.04)}75%{transform:translateY(2px) rotate(2deg) scale(.99)}}@keyframes scarf-help{0%,100%{transform:translateY(4px) rotate(-1.4deg)}50%{transform:translateY(7px) rotate(1.4deg) scale(.98)}}@keyframes scarf-error{0%,100%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(3px) rotate(1deg)}}@keyframes cape-left-idle{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg) translateY(-2px)}}@keyframes cape-right-idle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg) translateY(-2px)}}@keyframes cape-left-hover{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg) translateY(-3px)}}@keyframes cape-right-hover{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(8deg) translateY(-3px)}}@keyframes cape-left-opened{0%{transform:rotate(12deg)}60%{transform:rotate(-15deg) translateY(-8px)}100%{transform:rotate(2deg)}}@keyframes cape-right-opened{0%{transform:rotate(-12deg)}60%{transform:rotate(15deg) translateY(-8px)}100%{transform:rotate(-2deg)}}@keyframes cape-left-thinking{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-12deg) translateY(-3px)}}@keyframes cape-right-thinking{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(12deg) translateY(-3px)}}@keyframes cape-left-cheer{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-18deg) translateY(-11px)}}@keyframes cape-right-cheer{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(18deg) translateY(-11px)}}@keyframes cape-left-help{0%,100%{transform:rotate(2deg) translateY(14px)}50%{transform:rotate(6deg) translateY(20px)}}@keyframes cape-right-help{0%,100%{transform:rotate(-4deg) translateY(3px)}50%{transform:rotate(-16deg) translateY(8px)}}@keyframes cape-left-error{0%,100%{transform:rotate(7deg) translateX(-2px)}50%{transform:rotate(-5deg) translateX(3px)}}@keyframes cape-right-error{0%,100%{transform:rotate(-7deg) translateX(-2px)}50%{transform:rotate(5deg) translateX(3px)}}
@media(max-width:930px){.layout{grid-template-columns:1fr}.stage{height:650px}}@media(max-width:650px){main{padding:15px}.stage{height:540px}.scene{scale:.78}.buttons{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body><main><h1>Lantern Inky — Mood Rig V1</h1><p class="lead">Layered prototype with a neck scarf, independent cape panels, foreground light, and mood-specific poses.</p><div class="layout">
<section class="stage" id="stage" data-state="idle"><div class="scene" id="scene">
<div class="effects-back"><img class="fx halo" src="assets/halo.png" alt=""><img class="fx sparks" src="assets/sparks.png" alt=""><img class="fx broken" src="assets/broken_halo.png" alt=""></div>
<div class="character"><img class="part body" src="assets/body_blank.png" alt="Lantern Inky"><img class="part inner-glow" src="assets/inner_glow.png" alt="">
<img class="part scarf-cape scarf-cape-left" src="assets/cape_left.png" alt=""><img class="part scarf-cape scarf-cape-right" src="assets/cape_right.png" alt="">
<img class="part scarf" src="assets/scarf.png" alt="">
<img class="part eye eye-left" src="assets/eye_left.png" alt=""><img class="part eye eye-right" src="assets/eye_right.png" alt=""><img class="part lid lid-left" src="assets/lid_left.png" alt=""><img class="part lid lid-right" src="assets/lid_right.png" alt=""><img class="part mouth mouth-smile active" data-mouth="smile" src="assets/mouth_smile.png" alt=""><img class="part mouth mouth-open" data-mouth="open" src="assets/mouth_open.png" alt=""><img class="part mouth mouth-o" data-mouth="o" src="assets/mouth_o.png" alt=""><img class="part mouth mouth-frown" data-mouth="frown" src="assets/mouth_frown.png" alt=""></div>
<div class="effects-front"><img class="fx beam" src="assets/beam.png" alt=""></div>
</div></section>
<aside class="controls"><h2>Mood States</h2><div class="buttons"><button class="active" data-state="idle">Idle</button><button data-state="hover">Hover</button><button data-state="opened">Opened</button><button data-state="listening">Listening</button><button data-state="thinking">Thinking</button><button data-state="found">Found Something</button><button data-state="success">Success</button><button data-state="help">Needs Help</button><button data-state="error">Error</button><button data-state="offline">Offline</button></div><div class="status" id="status">Idle — the scarf rests naturally while the halo breathes.</div></aside>
</div></main><script>
const moods={idle:['smile','Idle — the scarf rests naturally while the halo breathes.'],hover:['smile','Hover — the scarf shifts gently while the foreground light searches.'],opened:['open','Opened — the scarf lifts in a welcoming reaction.'],listening:['smile','Listening — the scarf settles lower and stays calm.'],thinking:['o','Thinking — the scarf sways while the search beam scans.'],found:['open','Found Something — the scarf gives a focused lift.'],success:['open','Success — the scarf lifts during the celebration.'],help:['frown','Needs Help — the scarf droops with the hesitant glow.'],error:['o','Error — the scarf jitters while the light sputters.'],offline:['smile','Offline — the scarf hangs quietly while the chamber dims.']};
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),status=document.getElementById('status'),mouths=[...document.querySelectorAll('[data-mouth]')],eyes=[...document.querySelectorAll('.eye')];
function setState(state,button){stage.dataset.state=state;status.textContent=moods[state][1];mouths.forEach(m=>m.classList.toggle('active',m.dataset.mouth===moods[state][0]));document.querySelectorAll('button[data-state]').forEach(b=>b.classList.toggle('active',b===button))}
document.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>setState(button.dataset.state,button)));
stage.addEventListener('pointermove',event=>{if(stage.dataset.state==='offline'||stage.dataset.state==='error')return;const r=scene.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(event.clientX-r.left-r.width/2)/(r.width/2))),y=Math.max(-1,Math.min(1,(event.clientY-r.top-r.height/2)/(r.height/2)));eyes.forEach(eye=>eye.style.transform='translate('+(x*5)+'px,'+(y*4)+'px)')});stage.addEventListener('pointerleave',()=>eyes.forEach(eye=>eye.style.transform=''));
</script></body></html>
